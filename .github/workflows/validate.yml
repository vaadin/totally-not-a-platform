name: Validate

# Pins one commit of every component in config/components.json, builds it,
# runs its unit tests and records the result in manifest.json. Each component
# is built against the ones before it as pinned here, not against published
# versions: Flow Components against Flow, Platform against both.
#
# Flow resolves to its newest commit that already passed Flow's own
# validation, so it is built without running its tests again.
#
#   resolve ── flow-build ── flow-components-build ─┬─ flow-components-unit-tests ─┬─ manifest
#                                                   └─ platform ───────────────────┘
#
# Nothing is published: the only output is the manifest.json artifact.

on:
  workflow_dispatch:
    inputs:
      flow-ref:
        description: vaadin/flow branch, tag or commit (empty = config/components.json)
        required: false
        default: ''
      flow-components-ref:
        description: vaadin/flow-components branch, tag or commit (empty = config/components.json)
        required: false
        default: ''
      platform-ref:
        description: vaadin/platform branch, tag or commit (empty = config/components.json)
        required: false
        default: ''
  # A change to the orchestrator validates itself against the configured refs.
  pull_request:

# A new push to a PR supersedes its previous run; manual runs never cancel
# each other, as each can validate different refs.
concurrency:
  group: validate-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Versions the reactors are rewritten to: BUILD_VERSION for every component
  # Platform depends on (the one Flow's own CI uses), PLATFORM_BUILD_VERSION
  # for Platform (the one its CI uses). Neither is ever published, so Maven
  # can only resolve them from what this run built, never from a repository.
  BUILD_VERSION: 999.99-SNAPSHOT
  PLATFORM_BUILD_VERSION: 99.0-SNAPSHOT
  # Same retries Flow's validation passes; see vaadin/flow validation.yml.
  MAVEN_ARGS: >-
    -B -ntp
    -Daether.connector.http.retryHandler.count=3
    -Daether.connector.http.retryHandler.serviceUnavailable=429,500,502,503,504,403
    -Daether.connector.http.connectionMaxTtl=25

jobs:
  resolve:
    name: Resolve commits
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      flow-sha: ${{ steps.resolve.outputs.flow-sha }}
      flow-components-sha: ${{ steps.resolve.outputs.flow-components-sha }}
      platform-sha: ${{ steps.resolve.outputs.platform-sha }}
    steps:
      # Platform's production bundles need a Vaadin licence (the commercial
      # components).
      - name: Check secrets
        env:
          VAADIN_PRO_KEY: ${{ secrets.VAADIN_PRO_KEY }}
        run: |
          if [ -z "$VAADIN_PRO_KEY" ]; then
            echo "🚫 **VAADIN_PRO_KEY** is not defined; add it to ${{ github.repository }} as \`username/proKey\`" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Test the scripts
        run: node --test 'scripts/*.test.js'
      - name: Resolve the refs to commits
        id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FLOW_REF: ${{ inputs.flow-ref }}
          FLOW_COMPONENTS_REF: ${{ inputs.flow-components-ref }}
          PLATFORM_REF: ${{ inputs.platform-ref }}
        run: |
          node scripts/resolve-commits.js --out=commits.json \
            --flow-ref="$FLOW_REF" --flow-components-ref="$FLOW_COMPONENTS_REF" --platform-ref="$PLATFORM_REF"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: commits
          path: commits.json

  # Mirrors the `build` job of vaadin/flow validation.yml, using Flow's own
  # scripts and actions from the pinned commit. No tests: the commit already
  # passed Flow's validation (see resolve-commits.js).
  flow-build:
    name: Build Flow
    needs: resolve
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: vaadin/flow
          ref: ${{ needs.resolve.outputs.flow-sha }}
      - uses: ./.github/actions/setup-frontend-tools
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version-file: .tool-versions
          distribution: temurin
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-flow-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-flow-maven-
      # Flow builds from earlier runs end up in the cache; only this run's
      # build may be handed on.
      - name: Purge earlier Flow builds from the local repo
        run: rm -rf ~/.m2/repository/com/vaadin/*/"$BUILD_VERSION"
      - name: Set Flow version to ${{ env.BUILD_VERSION }}
        run: ./scripts/computeMatrix.js set-version --version="$BUILD_VERSION"
      # Unlike Flow's validation.yml, flow-gradle-plugin stays in: Platform's
      # Gradle plugin depends on it. -Drelease leaves out flow-tests, which
      # holds only integration tests, as Flow's pr-snapshot.yml does.
      - name: Compile and install Flow
        run: |
          cmd="mvn install -DskipTests -Drelease"
          $cmd -T 2C -q || $cmd
      # The installed Flow jars, which the jobs after this one build against.
      - name: Pack the build
        run: |
          (cd ~/.m2/repository && find com/vaadin -mindepth 2 -maxdepth 2 -type d -name "$BUILD_VERSION") \
            | tar cf flow-maven-artifacts.tar -C ~/.m2/repository -T -
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flow-maven-artifacts
          path: flow-maven-artifacts.tar
          compression-level: 0
          retention-days: 1

  # Mirrors the `build` job of vaadin/flow-components validation.yml, against
  # the Flow built above. Installs without tests: the tests run in the job
  # after this one, in parallel with Platform, which builds against this.
  flow-components-build:
    name: Build Flow Components
    needs: [resolve, flow-build]
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: vaadin/flow-components
          ref: ${{ needs.resolve.outputs.flow-components-sha }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - &restore-vaadin-builds
        name: Purge Vaadin artifacts from the local repo
        run: rm -rf ~/.m2/repository/com/vaadin
      - &download-flow
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: flow-maven-artifacts
      - &install-flow
        name: Install the Flow build into the local repo
        run: |
          mkdir -p ~/.m2/repository
          tar xf flow-maven-artifacts.tar -C ~/.m2/repository
          tar tf flow-maven-artifacts.tar | cut -d/ -f1-3 | sort -u | sed 's|$|/|' > "$RUNNER_TEMP/flow-artifacts.txt"
          rm flow-maven-artifacts.tar
      - &set-flow-components-version
        name: Set Flow Components version to ${{ env.BUILD_VERSION }}
        run: |
          mvn -q org.codehaus.mojo:versions-maven-plugin:2.22.0:set \
            -DnewVersion="$BUILD_VERSION" -DprocessAllModules=true -DgenerateBackupPoms=false
      # -Drelease leaves out the integration test modules; -Dflow.version
      # points every module at the Flow build.
      - name: Compile and install Flow Components
        run: |
          cmd="mvn install -Dmaven.test.skip=true -Drelease -Dflow.version=$BUILD_VERSION"
          $cmd -T 1C || { echo "::warning::Retrying without parallelism"; $cmd; }
      # The Flow Components jars (the Flow ones at the same version are left
      # out, they travel in their own artifact), plus the charts SVG generator
      # output, which the unit test job would otherwise rebuild.
      - name: Pack the build
        run: |
          (cd ~/.m2/repository && find com/vaadin -mindepth 2 -maxdepth 2 -type d -name "$BUILD_VERSION") \
            | grep -vFf "$RUNNER_TEMP/flow-artifacts.txt" \
            | tar cf flow-components-maven-artifacts.tar -C ~/.m2/repository -T -
          tar cf flow-components-generated.tar vaadin-charts-flow-parent/vaadin-charts-flow-svg-generator/src/main/resources/META-INF/frontend/generated
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flow-components-maven-artifacts
          path: flow-components-maven-artifacts.tar
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flow-components-generated
          path: flow-components-generated.tar
          retention-days: 1

  # Mirrors the unit test step of vaadin/flow-components validation.yml.
  # `mvn test`, so no integration tests run.
  flow-components-unit-tests:
    name: Flow Components unit tests
    needs: [resolve, flow-build, flow-components-build]
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: vaadin/flow-components
          ref: ${{ needs.resolve.outputs.flow-components-sha }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - *restore-vaadin-builds
      - *download-flow
      - *install-flow
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: flow-components-maven-artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: flow-components-generated
      - name: Restore the Flow Components build
        run: |
          tar xf flow-components-maven-artifacts.tar -C ~/.m2/repository
          tar xf flow-components-generated.tar
          rm flow-components-*.tar
      - *set-flow-components-version
      - name: Install the Vaadin licence
        env:
          VAADIN_PRO_KEY: ${{ secrets.VAADIN_PRO_KEY }}
        run: |
          mkdir -p ~/.vaadin
          printf '{"username":"%s","proKey":"%s"}' "${VAADIN_PRO_KEY%%/*}" "${VAADIN_PRO_KEY#*/}" > ~/.vaadin/proKey
      # surefire.timeout limits each module's test JVM to 10 minutes in total,
      # so a hung test fails its module by name instead of the job timing
      # out. The whole unit test run takes about 5 minutes.
      - name: Run unit tests
        run: |
          mvn test -Drelease -Dflow.version="$BUILD_VERSION" -DskipSvgChartsBuild \
            -T 1C -Dsurefire.parallel=classes -Dsurefire.threadCount=2 -Dsurefire.timeout=600
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: flow-components-test-reports
          if-no-files-found: ignore
          retention-days: 7
          path: '**/target/surefire-reports/*.xml'

  # Mirrors the `build` job of vaadin/platform pr-validation.yml with two
  # differences: versions.json points Flow and Flow Components at the builds
  # above, and the unit tests run. `install`, not `test` or `package`: vaadin-dev-bundle
  # unpacks a sibling module's packaged jar, and vaadin-gradle-plugin's
  # nested Gradle build resolves the bundles from the local repository. No
  # integration tests run all the same: they live only in the
  # vaadin-platform-*-test modules, whose profiles (npm-it, react-hybrid, ...)
  # are not enabled here.
  platform:
    name: Build and test Platform
    needs: [resolve, flow-build, flow-components-build]
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      NODE_VERSION: 26.12.1
      MAVEN_VERSION: 3.9.2
      JAVA_VERSION: 21
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: vaadin/platform
          ref: ${{ needs.resolve.outputs.platform-sha }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - uses: stCarolas/setup-maven@12eb41b233df95d49b0c11fc1b5bc8312e5d4ce0 # v5.1
        with:
          maven-version: ${{ env.MAVEN_VERSION }}
      # Stale Vaadin snapshots in the cache would mask what this run builds.
      - name: Purge Vaadin and Hilla artifacts from the local repo
        run: rm -rf ~/.m2/repository/com/vaadin ~/.m2/repository/dev/hilla ~/.gradle
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: flow-maven-artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: flow-components-maven-artifacts
      - name: Install the Flow and Flow Components builds into the local repo
        run: |
          mkdir -p ~/.m2/repository
          tar xf flow-maven-artifacts.tar -C ~/.m2/repository
          tar xf flow-components-maven-artifacts.tar -C ~/.m2/repository
          rm flow-*.tar
      # Flow Components entries are "{{version}}" (they follow the Platform
      # version) in versions.json; every core one of them is a Flow
      # Components module.
      - name: Point versions.json at the builds above
        run: |
          node -e '
            const fs = require("fs");
            const versions = JSON.parse(fs.readFileSync("versions.json", "utf8"));
            versions.core.flow.javaVersion = process.env.BUILD_VERSION;
            for (const component of Object.values(versions.core)) {
              if (component.javaVersion === "{{version}}") {
                component.javaVersion = process.env.BUILD_VERSION;
              }
            }
            fs.writeFileSync("versions.json", JSON.stringify(versions, null, 4) + "\n");
          '
          git diff versions.json
      - name: Install the Vaadin licence
        env:
          VAADIN_PRO_KEY: ${{ secrets.VAADIN_PRO_KEY }}
        run: |
          mkdir -p ~/.vaadin
          printf '{"username":"%s","proKey":"%s"}' "${VAADIN_PRO_KEY%%/*}" "${VAADIN_PRO_KEY#*/}" > ~/.vaadin/proKey
      - name: Generate BOMs
        run: scripts/generateBoms.sh
      - name: Set Platform version to ${{ env.PLATFORM_BUILD_VERSION }}
        run: mvn -DnewVersion="$PLATFORM_BUILD_VERSION" -DgenerateBackupPoms=false versions:set
      - name: Build and run unit tests
        run: |
          mvn -e -V -U -Dvaadin.npm.minimumFrontendPackageAgeDays=0 \
            -Pproduction,jandex,hilla,dev-bundle,gradle,enforcer,ee,oss \
            -T 1C -Daether.syncContext.named.time=180 \
            install
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: platform-test-reports
          if-no-files-found: ignore
          retention-days: 7
          path: '**/target/*-reports/*.xml'

  manifest:
    name: Write manifest
    needs: [resolve, flow-build, flow-components-build, flow-components-unit-tests, platform]
    if: always() && needs.resolve.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: commits
      - name: Write manifest.json
        env:
          RESULTS: >-
            {
              "flow": ["${{ needs.flow-build.result }}"],
              "flow-components": ["${{ needs.flow-components-build.result }}", "${{ needs.flow-components-unit-tests.result }}"],
              "platform": ["${{ needs.platform.result }}"]
            }
        run: node scripts/write-manifest.js --commits=commits.json --results="$RESULTS" --out=manifest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: manifest
          path: manifest.json
