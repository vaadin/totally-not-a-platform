name: Validate

# Pins one commit of every component in config/components.json, builds it,
# runs its unit tests and records the result in manifest.json. Each component
# is built against the ones before it as pinned here, not against published
# versions: Flow Components against Flow, Platform against both.
#
# Flow resolves to its newest commit that already passed Flow's own
# validation, so it is built without running its tests again.
#
#   resolve ── <components, each after the ones it builds on> ── platform ── manifest
#
# A component is built by a job named after it, usually a call of
# build-component.yml; where its unit tests run, a `<component>-unit-tests`
# job runs them in parallel with whatever builds on the component next.
#
# Nothing is published: the only output is the manifest.json artifact.

on:
  workflow_dispatch:
    inputs:
      flow-ref:
        description: vaadin/flow branch, tag or commit, which must have passed Flow's validation (empty = newest green commit of config/components.json's ref)
        required: false
        default: ''
      flow-components-ref:
        description: vaadin/flow-components branch, tag or commit (empty = config/components.json)
        required: false
        default: ''
      testbench-ref:
        description: vaadin/testbench branch, tag or commit (empty = config/components.json)
        required: false
        default: ''
      hilla-ref:
        description: vaadin/hilla branch, tag or commit (empty = config/components.json)
        required: false
        default: ''
      platform-ref:
        description: vaadin/platform branch, tag or commit (empty = config/components.json)
        required: false
        default: ''
  # A change to the orchestrator validates itself against the configured refs.
  pull_request:

# A new push to a PR supersedes its previous run; manual runs never cancel
# each other, as each can validate different refs.
concurrency:
  group: validate-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  # Jobs download the artifacts of earlier jobs with `gh run download`.
  actions: read

env:
  # Versions the reactors are rewritten to: BUILD_VERSION for every component
  # Platform depends on (the one Flow's own CI uses), PLATFORM_BUILD_VERSION
  # for Platform (the one its CI uses). Neither is ever published, so Maven
  # can only resolve them from what this run built, never from a repository.
  BUILD_VERSION: 999.99-SNAPSHOT
  PLATFORM_BUILD_VERSION: 99.0-SNAPSHOT
  # Same retries Flow's validation passes; see vaadin/flow validation.yml.
  MAVEN_ARGS: >-
    -B -ntp
    -Daether.connector.http.retryHandler.count=3
    -Daether.connector.http.retryHandler.serviceUnavailable=429,500,502,503,504,403
    -Daether.connector.http.connectionMaxTtl=25

jobs:
  resolve:
    name: Resolve commits
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      commits: ${{ steps.resolve.outputs.commits }}
      # For the build-component.yml calls, which cannot read `env`.
      build-version: ${{ env.BUILD_VERSION }}
    steps:
      # Platform's production bundles need a Vaadin licence (the commercial
      # components).
      - name: Check secrets
        env:
          VAADIN_PRO_KEY: ${{ secrets.VAADIN_PRO_KEY }}
        run: |
          if [ -z "$VAADIN_PRO_KEY" ]; then
            echo "🚫 **VAADIN_PRO_KEY** is not defined; add it to ${{ github.repository }} as \`username/proKey\`" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Test the scripts
        run: node --test 'scripts/*.test.js'
      - name: Resolve the refs to commits
        id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FLOW_REF: ${{ inputs.flow-ref }}
          FLOW_COMPONENTS_REF: ${{ inputs.flow-components-ref }}
          TESTBENCH_REF: ${{ inputs.testbench-ref }}
          HILLA_REF: ${{ inputs.hilla-ref }}
          PLATFORM_REF: ${{ inputs.platform-ref }}
        run: |
          node scripts/resolve-commits.js --out=commits.json \
            --flow-ref="$FLOW_REF" --flow-components-ref="$FLOW_COMPONENTS_REF" --testbench-ref="$TESTBENCH_REF" --hilla-ref="$HILLA_REF" --platform-ref="$PLATFORM_REF"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: commits
          path: commits.json

  # Flow's commit already passed its own validation, so no tests. Unlike
  # Flow's validation.yml, flow-gradle-plugin stays in: Platform's Gradle
  # plugin depends on it. -Drelease leaves out flow-tests (integration tests
  # only), as Flow's pr-snapshot.yml does.
  flow:
    name: Flow
    needs: resolve
    uses: ./.github/workflows/build-component.yml
    secrets: inherit
    with:
      component: flow
      repository: vaadin/flow
      sha: ${{ fromJSON(needs.resolve.outputs.commits).flow.sha }}
      build-version: ${{ needs.resolve.outputs.build-version }}
      node-version: '26'
      set-version: ./scripts/computeMatrix.js set-version --version="$BUILD_VERSION"
      build: |
        cmd="mvn install -DskipTests -Drelease"
        $cmd -T 2C -q || $cmd

  # Mirrors the build and unit test steps of vaadin/flow-components
  # validation.yml. -Drelease leaves out the integration test modules,
  # -Dflow.version points every module at the Flow build. The charts SVG
  # generator output is carried over so the tests need not rebuild it.
  flow-components:
    name: Flow Components
    needs: [resolve, flow]
    uses: ./.github/workflows/build-component.yml
    secrets: inherit
    with:
      component: flow-components
      repository: vaadin/flow-components
      sha: ${{ fromJSON(needs.resolve.outputs.commits)['flow-components'].sha }}
      upstream: flow
      build-version: ${{ needs.resolve.outputs.build-version }}
      build: |
        cmd="mvn install -Dmaven.test.skip=true -Drelease -Dflow.version=$BUILD_VERSION"
        $cmd -T 1C || { echo "::warning::Retrying without parallelism"; $cmd; }
      carry: vaadin-charts-flow-parent/vaadin-charts-flow-svg-generator/src/main/resources/META-INF/frontend/generated

  # surefire.timeout limits each module's test JVM to 10 minutes in total, so
  # a hung test fails its module by name instead of the job timing out; the
  # whole unit test run takes about 5 minutes.
  flow-components-unit-tests:
    name: Flow Components
    needs: [resolve, flow, flow-components]
    uses: ./.github/workflows/build-component.yml
    secrets: inherit
    with:
      component: flow-components
      repository: vaadin/flow-components
      sha: ${{ fromJSON(needs.resolve.outputs.commits)['flow-components'].sha }}
      upstream: flow
      build-version: ${{ needs.resolve.outputs.build-version }}
      carry: vaadin-charts-flow-parent/vaadin-charts-flow-svg-generator/src/main/resources/META-INF/frontend/generated
      test: >-
        mvn test -Drelease -Dflow.version="$BUILD_VERSION" -DskipSvgChartsBuild
        -T 1C -Dsurefire.parallel=classes -Dsurefire.threadCount=2 -Dsurefire.timeout=600

  # Mirrors the build and unit test jobs of vaadin/testbench validation.yml.
  # The integration test modules (active unless -Drelease) stay in the
  # reactor, as the UI unit test support modules among them are needed, but
  # -Djetty.skip keeps them from starting Jetty, whose parallel starts would
  # otherwise race for port 8080.
  # -Dflow.version points the modules at the Flow build; vaadin.version (the
  # `vaadin` platform pom, provided scope, for the UI unit testing modules)
  # stays at the published snapshot, as Platform builds after this.
  testbench:
    name: TestBench
    needs: [resolve, flow]
    uses: ./.github/workflows/build-component.yml
    secrets: inherit
    with:
      component: testbench
      repository: vaadin/testbench
      sha: ${{ fromJSON(needs.resolve.outputs.commits)['testbench'].sha }}
      upstream: flow
      build-version: ${{ needs.resolve.outputs.build-version }}
      node-version: '20'
      build: >-
        mvn install -DskipTests -Djetty.skip -Dflow.version="$BUILD_VERSION" -T 1C

  testbench-unit-tests:
    name: TestBench
    needs: [resolve, flow, testbench]
    uses: ./.github/workflows/build-component.yml
    secrets: inherit
    with:
      component: testbench
      repository: vaadin/testbench
      sha: ${{ fromJSON(needs.resolve.outputs.commits)['testbench'].sha }}
      upstream: flow
      build-version: ${{ needs.resolve.outputs.build-version }}
      node-version: '20'
      test: >-
        mvn test -Dflow.version="$BUILD_VERSION"

  # Mirrors the init and test-java jobs of vaadin/hilla validation.yml: the
  # TypeScript packages are built first, as the Java build packages them.
  # The integration test modules (it-modules profile) and the Gradle plugin,
  # whose tests run Gradle builds, are left out of the unit tests, as Hilla's
  # own validation does. The TypeScript unit tests do not run here.
  hilla:
    name: Hilla
    needs: [resolve, flow, testbench]
    uses: ./.github/workflows/build-component.yml
    secrets: inherit
    with:
      component: hilla
      repository: vaadin/hilla
      sha: ${{ fromJSON(needs.resolve.outputs.commits)['hilla'].sha }}
      upstream: flow testbench
      build-version: ${{ needs.resolve.outputs.build-version }}
      prepare: npm ci --ignore-scripts && npm run build
      build: >-
        mvn install -DskipTests -Dmaven.test.skip=true -Dmaven.javadoc.skip=true -Dflow.version="$BUILD_VERSION" -Dtestbench.version="$BUILD_VERSION"

  hilla-unit-tests:
    name: Hilla
    needs: [resolve, flow, testbench, hilla]
    uses: ./.github/workflows/build-component.yml
    secrets: inherit
    with:
      component: hilla
      repository: vaadin/hilla
      sha: ${{ fromJSON(needs.resolve.outputs.commits)['hilla'].sha }}
      upstream: flow testbench
      build-version: ${{ needs.resolve.outputs.build-version }}
      prepare: npm ci --ignore-scripts && npm run build
      test: >-
        mvn test -P'!it-modules' -pl '!:hilla-gradle-plugin' -Dflow.version="$BUILD_VERSION" -Dtestbench.version="$BUILD_VERSION"

  # Mirrors the `build` job of vaadin/platform pr-validation.yml with two
  # differences: versions.json points every component built above at its
  # build (the `platformVersions` of config/components.json), and the unit
  # tests run. `install`, not `test` or `package`: vaadin-dev-bundle
  # unpacks a sibling module's packaged jar, and vaadin-gradle-plugin's
  # nested Gradle build resolves the bundles from the local repository. No
  # integration tests run all the same: they live only in the
  # vaadin-platform-*-test modules, whose profiles (npm-it, react-hybrid, ...)
  # are not enabled here.
  platform:
    name: Build and test Platform
    needs: [resolve, flow, flow-components, testbench, hilla]
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      NODE_VERSION: 26.12.1
      MAVEN_VERSION: 3.9.2
      JAVA_VERSION: 21
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: vaadin/platform
          ref: ${{ fromJSON(needs.resolve.outputs.commits).platform.sha }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - uses: stCarolas/setup-maven@12eb41b233df95d49b0c11fc1b5bc8312e5d4ce0 # v5.1
        with:
          maven-version: ${{ env.MAVEN_VERSION }}
      # Stale Vaadin snapshots in the cache would mask what this run builds.
      - name: Purge Vaadin and Hilla artifacts from the local repo
        run: rm -rf ~/.m2/repository/com/vaadin ~/.m2/repository/dev/hilla ~/.gradle
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          path: orchestrator
      - name: Install the component builds into the local repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ~/.m2/repository "$RUNNER_TEMP/builds"
          for component in $(jq -r 'to_entries[] | select(.value.platformVersions) | .key' orchestrator/config/components.json); do
            gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -n "$component-maven-artifacts" -D "$RUNNER_TEMP/builds"
            tar xf "$RUNNER_TEMP/builds/$component-maven-artifacts.tar" -C ~/.m2/repository
          done
          rm -rf "$RUNNER_TEMP/builds"
      - name: Point versions.json at the component builds
        run: |
          node orchestrator/scripts/pin-platform-versions.js --versions=versions.json --version="$BUILD_VERSION"
          rm -rf orchestrator
          git diff versions.json
      - name: Install the Vaadin licence
        env:
          VAADIN_PRO_KEY: ${{ secrets.VAADIN_PRO_KEY }}
        run: |
          mkdir -p ~/.vaadin
          printf '{"username":"%s","proKey":"%s"}' "${VAADIN_PRO_KEY%%/*}" "${VAADIN_PRO_KEY#*/}" > ~/.vaadin/proKey
      - name: Generate BOMs
        run: scripts/generateBoms.sh
      - name: Set Platform version to ${{ env.PLATFORM_BUILD_VERSION }}
        run: mvn -DnewVersion="$PLATFORM_BUILD_VERSION" -DgenerateBackupPoms=false versions:set
      - name: Build and run unit tests
        run: |
          mvn -e -V -U -Dvaadin.npm.minimumFrontendPackageAgeDays=0 \
            -Pproduction,jandex,hilla,dev-bundle,gradle,enforcer,ee,oss \
            -T 1C -Daether.syncContext.named.time=180 \
            install
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: platform-test-reports
          if-no-files-found: ignore
          retention-days: 7
          path: '**/target/*-reports/*.xml'

  manifest:
    name: Write manifest
    needs: [resolve, flow, flow-components, flow-components-unit-tests, testbench, testbench-unit-tests, hilla, hilla-unit-tests, platform]
    if: always() && needs.resolve.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: commits
      # Each component is validated by the job named after it, plus
      # `<component>-unit-tests` where there is one.
      - name: Write manifest.json
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/write-manifest.js --commits=commits.json --needs="$NEEDS" --out=manifest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: manifest
          path: manifest.json
